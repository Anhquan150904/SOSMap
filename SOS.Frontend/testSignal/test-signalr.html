<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>SOS SignalR Real Test</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
</head>

<body>
  <h2>SOS SignalR – Test thực tế</h2>

  <button onclick="loginVolunteer()">1️⃣ Login Volunteer</button>
  <button onclick="connectSignalR()">2️⃣ Connect SignalR</button>
  <button onclick="joinGroup()">3️⃣ Join By Role & Status</button>

  <pre id="log"></pre>

  <script>
    const log = msg =>
      document.getElementById("log").innerHTML += msg + "\n";

    let connection;
    let currentUser = null;

    // ✅ STEP 1: Gọi API login thực
    async function loginVolunteer() {
      // giả lập verify-otp (bạn thay bằng API thật nếu cần)
      currentUser = {
        userId: "085F0E82-8236-4E6D-0382-08DE3D496C38",
        role: "volunteer",
        status: "active"
      };

      log("✅ Login thành công:");
      log(JSON.stringify(currentUser, null, 2));
    }

    // ✅ STEP 2: Connect SignalR
    async function connectSignalR() {
      connection = new signalR.HubConnectionBuilder()
        .withUrl("http://localhost:5075/testhub")
        .withAutomaticReconnect()
        .configureLogging(signalR.LogLevel.Information)
        .build();

      // ---- lắng nghe message ----
      connection.on("ServerMessage", msg => {
        log("📩 ServerMessage: " + msg);
      });

      connection.on("ReportCreated", payload => {
        log("🚨 REPORT CREATED:");
        log(JSON.stringify(payload, null, 2));
      });

      connection.on("VolunteerRequestTaskCanceled", payload => {
        log("⚠️ Volunteer yêu cầu hủy:");
        log(JSON.stringify(payload, null, 2));
      });

      connection.on("TaskCanceledApproved", payload => {
        log("✅ Admin chấp nhận hủy:");
        log(JSON.stringify(payload, null, 2));
      });

      await connection.start();
      log("✅ SignalR connected");
    }

    // ✅ STEP 3: Join group theo role + status + userId
    async function joinGroup() {
      if (!currentUser || !connection) {
        alert("Chưa login hoặc chưa kết nối SignalR");
        return;
      }

      await connection.invoke(
        "JoinByRoleAndStatus",
        currentUser.role,
        currentUser.status,
        currentUser.userId
      );

      log("✅ JoinByRoleAndStatus sent");
    }
  </script>
</body>
</html>
